[colors]

#bg = #23252e
; bg = #252525
bg = #14181c
#fg = #f9f8fe
fg = #d6d6d6
red = #c76b6b
blue = #5cc0e0
green = #8fee96
yellow = #c9c9c9
gr = #7a8a99
#gr = #4e4e4e
white = #e6e6e6

[bar/example]
width = 100%
height = 18pt
radius = 0
bottom = false

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 0pt

padding-left = 0
padding-right = 0

module-margin = 0
offset-x = 10
offset-y = 10

border-size = 4pt
border-color = ${colors.bg}

font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;2
font-1 = Symbols Nerd Font:style=Regular:size=10;2
font-2 = Symbols Nerd Font:style=Regular:size=17;3
font-3 = JetBrainsMono Nerd Font:style=Regular:size=12;2

; modules-left = sep cpu sep memory sep weather sep sep xwindow
; modules-center = xworkspaces
; modules-right = cmus sep sep pulseaudio sep1 xkeyboard  date sep powermenu_bottom sep
;
modules-left = sep xworkspaces 
modules-center = cmus 
modules-right = sep_arrow sep1 cpu sep1 sep_line_thin sep1 pulseaudio sep1 sep_line_thin sep1 battery sep1 sep_line_thin sep1 network sep1 sep_line_thin sep1 xkeyboard sep_line_thin date sep1 sep_arrow_right

dpi-x = 96
dpi-y = 96

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = bspwm


; tray-position = center
; tray-background = ${colors.bg}
; tray-offset-x = 124pt
; tray-padding = 5


[settings]
screenchange-reload = true
pseudo-transparency = true
; pseudo-transparency = true


[module/launch_bottom]
type = custom/script
exec = echo "󰣇"
click-left =  rofi -show drun -config .config/bspwm/themes/bspwm_city/rofi/menu_bottom.rasi -show-icons
label-foreground = ${colors.bg}
label-background = ${colors.fg}
label-font = 1


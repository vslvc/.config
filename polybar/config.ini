[module/battery]
type = internal/battery

; Укажите название вашей батареи. Узнать можно командой: ls /sys/class/power_supply/
battery = BAT0
adapter = ADP0

; Когда батарея считается "полной", если она не достигает 100%
full-at = 98

; Порог для предупреждения о низком заряде
low-at = 10

; Формат при разряде
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

; Формат при зарядке
format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%

; Формат, когда батарея полностью заряжена
format-full = <ramp-capacity> <label-full>
label-full = Fully charged

; Текст и иконки для предупреждения о низком заряде
label-low = ⚠ LOW
animation-low-0 = ⚠
animation-low-1 = 🔋
animation-low-framerate = 500

; Иконки для разных уровней заряда
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

; Анимация во время зарядки
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

; Интервал обновления (в секундах)
interval = 5



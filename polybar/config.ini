; type = custom/script
; exec = /home/owl/.config/bspwm/themes/gawr_gura/scripts/weather.sh
; interval = 600
; format-prefix = " "
;
; format-prefix-foreground = ${colors.fg}
; format-prefix-background = ${colors.bg}
; label-foreground = ${colors.fg}
; label-background = ${colors.bg}


[module/cmus]
type = custom/script
exec = ~/.config/polybar/scripts/cmus.sh
exec-if = pgrep -x cmus
interval = 1

click-left = cmus-remote --pause
click-right = cmus-remote --play
scroll-up = cmus-remote --next
scroll-down = cmus-remote --prev

format-prefix = " "
format = <label>
label = %output%
label-maxlen = 40

format-prefix-foreground = ${colors.fg}
format-prefix-background = ${colors.bg}
label-foreground = ${colors.fg}
label-background = ${colors.bg}


 [module/alsa]
 type = internal/alsa

 master-soundcard = default
 speaker-soundcard = default
 headphone-soundcard = default

 master-mixer = Master
 interval = 5
 format-volume = <label-volume>

 format-volume-prefix = "  "
 format-volume-prefix-foreground = ${colors.fg}
 format-volume-prefix-background = ${colors.gr}

 label-volume = %percentage%%
 label-volume-foreground =${colors.fg}
 label-volume-background =${colors.bg}
 label-volume-padding = 1


[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.fg}
format-volume-prefix-background = ${colors.bg}

format-volume = <label-volume>
label-volume-foreground = ${colors.fg}
label-volume-background = ${colors.bg}
label-volume = %percentage%%

label-muted = 󰝟 muted
label-muted-foreground = ${colors.red}
label-muted-background = ${colors.bg}

; Иконки для разных уровней громкости
volume-0 = 󰸈
volume-1 = 󰕿
volume-2 = 󰖀
volume-3 = 󰕾

 [module/xkeyboard]
 type = internal/xkeyboard
 blacklist-0 = num lock
 blacklist-1 = caps lock

 label-layout = "%icon% "
 layout-icon-0 = us;US
 layout-icon-1 = ru;RU
 label-layout-foreground = ${colors.fg}
 label-layout-background = ${colors.bg}


[module/powermenu_bottom]
type = custom/script
exec = echo ""
click-left = ~/.config/polybar/scripts/powermenu.sh
label-foreground = ${colors.red}
label-background = ${colors.bg}


[module/memory]
type = internal/memory
interval = 2
label = %percentage_used:2%%
format-prefix =" "
format-prefix-foreground = ${colors.fg}
format-prefix-background = ${colors.bg}
label-foreground = ${colors.fg}
label-background = ${colors.bg}


[module/cpu]
type = internal/cpu
interval = 5
label = %percentage:2%%
format-prefix =""
format-prefix-foreground = ${colors.fg}
format-prefix-background = ${colors.bg}
label-foreground = ${colors.fg}
label-background = ${colors.bg}


 [module/cava]
 type = custom/script
 tail = true
 exec = ~/.config/bspwm/themes/gawr_gura/scripts/cava.sh
 format = <label>
 format-background = ${colors.gr}
 format-font = 2
 label = %output%
 format-padding = 1

 [module/sep]
 type = custom/text
 content = ___
 content-foreground = ${colors.bg}

 [module/sep1]
 type = custom/text
 content = _
 content-foreground = ${colors.bg}

 [module/sep2]
 type = custom/text
 content = __
 content-foreground = ${colors.bg}

[module/network]
type = internal/network
interface = wlp2s0
interval = 3

format-connected = <label-connected> 
format-disconnected = <label-disconnected>

label-connected = 󰤨 %essid% %signal%%
label-connected-foreground = ${colors.fg}
label-connected-background = ${colors.bg}

label-disconnected = 󰤮 Offline
label-disconnected-foreground = ${colors.red}
label-disconnected-background = ${colors.bg}


[module/sep_arrow]
type = custom/text
content = "  "
content-foreground = ${colors.gr}
content-background = ${colors.bg}

[module/sep_arrow_right]
type = custom/text
content = "  "
content-foreground = ${colors.gr}
content-background = ${colors.bg}

[module/sep_line]
type = custom/text
content = " ┃ "
content-foreground = ${colors.gr}
content-background = ${colors.bg}

[module/sep_line_thin]
type = custom/text
content = " │ "
content-foreground = ${colors.gr}
content-background = ${colors.bg}

[module/sep_nerd_arrow]
type = custom/text
content = "  "
content-foreground = ${colors.gr}
content-background = ${colors.bg}

[module/sep_nerd_arrow2]
type = custom/text
content = "  "
content-foreground = ${colors.gr}
content-background = ${colors.bg}

[module/sep_nerd_arrow3]
type = custom/text
content = "  "
content-foreground = ${colors.gr}
content-background = ${colors.bg}

[module/sep_nerd_arrow4]
type = custom/text
content = "  "
content-foreground = ${colors.gr}
content-background = ${colors.bg}
